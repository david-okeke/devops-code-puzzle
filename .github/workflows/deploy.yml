name: Terraform Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infrastructure/terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=${{ env.TF_DIR }} init -backend=false
      - run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive
      - run: terraform -chdir=${{ env.TF_DIR }} validate

  plan-dev:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   # 👈 you create this GitHub secret — see below
          aws-region: us-east-1                                # 👈 match the region in your .tfvars
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=${{ env.TF_DIR }} init
      - run: terraform -chdir=${{ env.TF_DIR }} plan -var-file=environments/dev.tfvars

  apply-dev:
    needs: plan-dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development   # 👈 you create this "Environment" in GitHub settings — see below
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=${{ env.TF_DIR }} init
      - run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve -var-file=environments/dev.tfvars

  apply-prod:
    needs: apply-dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # 👈 you create this "Environment" in GitHub settings, WITH a required reviewer — see below
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=${{ env.TF_DIR }} init
      - run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve -var-file=environments/prod.tfvars